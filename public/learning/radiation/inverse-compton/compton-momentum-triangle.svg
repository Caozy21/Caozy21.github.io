<svg xmlns="http://www.w3.org/2000/svg" width="940" height="348" viewBox="0 0 940 348"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#24364a} .tit{font-size:19px;font-weight:700}.sub{font-size:13px}.lab{font-size:16px;font-weight:600}.muted{fill:#68778c}.blue{stroke:#287ec1;fill:none}.orange{stroke:#df8835;fill:none}.green{stroke:#29957e;fill:none}.axis{stroke:#8492a5;stroke-width:1.4}.grey{stroke:#9daabb;fill:none}</style><defs><marker id="mB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#287ec1"/></marker><marker id="mO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#df8835"/></marker><marker id="mG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#29957e"/></marker><marker id="mGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#8895a7"/></marker></defs><text x="32" y="34" class="tit">Photon scattering: recoil momentum from a vector triangle</text>
<text x="32" y="57" class="sub muted">Illustrative Thomson-limit geometry: |p_in| ≈ |p_out| ≈ epsilon/c</text>
<path d="M120 255 L460 255" stroke="#287ec1" stroke-width="4.5" marker-end="url(#mB)"/>
<path d="M120 255 L392 50" stroke="#29957e" stroke-width="4.5" marker-end="url(#mG)"/>
<path d="M392 50 L460 255" stroke="#df8835" stroke-width="4.5" marker-end="url(#mO)"/>
<path d="M181 255 A61 61 0 0 0 168.8 218.3" stroke="#75869b" stroke-width="2.3" fill="none"/>
<circle cx="120" cy="255" r="6" fill="#46556a"/>
<text x="290" y="290" class="lab" fill="#287ec1">p_in</text>
<text x="244" y="128" class="lab" fill="#29957e">p_out</text>
<text x="510" y="144" class="lab" fill="#df8835">q = p_in − p_out</text>
<text x="181" y="223" class="lab">theta</text>
<text x="638" y="228" class="sub">Momentum conservation:</text>
<text x="638" y="250" class="lab">p_in = p_out + q</text>
<text x="638" y="285" class="sub">Cosine law:</text>
<text x="638" y="307" class="lab">q² = 2p²(1 − cos θ)</text>
</svg>
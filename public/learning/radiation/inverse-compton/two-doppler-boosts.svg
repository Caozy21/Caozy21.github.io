<svg xmlns="http://www.w3.org/2000/svg" width="940" height="355" viewBox="0 0 940 355"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#24364a} .tit{font-size:19px;font-weight:700}.sub{font-size:13px}.lab{font-size:16px;font-weight:600}.muted{fill:#68778c}.blue{stroke:#287ec1;fill:none}.orange{stroke:#df8835;fill:none}.green{stroke:#29957e;fill:none}.axis{stroke:#8492a5;stroke-width:1.4}.grey{stroke:#9daabb;fill:none}</style><defs><marker id="mB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#287ec1"/></marker><marker id="mO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#df8835"/></marker><marker id="mG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#29957e"/></marker><marker id="mGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#8895a7"/></marker></defs><text x="28" y="38" class="tit">Inverse Compton in the Thomson regime: two Doppler boosts</text>
<text x="28" y="65" class="sub muted">Head-on incidence, ultrarelativistic electron; maximal outgoing photon energy</text><rect x="24" y="98" width="204" height="166" rx="15" fill="#287ec1" fill-opacity=".065" stroke="#287ec1" stroke-opacity=".55"/><text x="38" y="127" class="lab">1  Lab frame</text><text x="38" y="163" class="sub">Soft seed photon</text><text x="38" y="207" font-size="15" fill="#287ec1">epsilon</text><path d="M231 177 H246" stroke="#8895a7" stroke-width="3" marker-end="url(#mGray)"/><rect x="250" y="98" width="204" height="166" rx="15" fill="#29957e" fill-opacity=".065" stroke="#29957e" stroke-opacity=".55"/><text x="264" y="127" class="lab">2  Electron rest frame</text><text x="264" y="163" class="sub">Incoming photon</text><text x="264" y="207" font-size="15" fill="#29957e">epsilon_prime ≈ 2 gamma epsilon</text><path d="M457 177 H472" stroke="#8895a7" stroke-width="3" marker-end="url(#mGray)"/><rect x="476" y="98" width="204" height="166" rx="15" fill="#d58b35" fill-opacity=".065" stroke="#d58b35" stroke-opacity=".55"/><text x="490" y="127" class="lab">3  Thomson scatter</text><text x="490" y="163" class="sub">Photon redirected</text><text x="490" y="207" font-size="15" fill="#d58b35">epsilon_prime_out ≈ epsilon_prime</text><path d="M683 177 H698" stroke="#8895a7" stroke-width="3" marker-end="url(#mGray)"/><rect x="702" y="98" width="204" height="166" rx="15" fill="#9362b1" fill-opacity=".065" stroke="#9362b1" stroke-opacity=".55"/><text x="716" y="127" class="lab">4  Back to lab frame</text><text x="716" y="163" class="sub">Upscattered photon</text><text x="716" y="207" font-size="15" fill="#9362b1">epsilon_out ≈ 4 gamma² epsilon</text><text x="33" y="304" class="sub">The collision is nearly elastic only in the electron rest frame if epsilon_prime &lt;&lt; m_e c².</text>
<text x="33" y="329" class="sub muted">The final boost is frame-dependent; the energy gain comes from the electron's kinetic energy.</text></svg>
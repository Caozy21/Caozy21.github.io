<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 950 290" width="950" height="290" role="img">
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<text x="475" y="32" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#213247">Two indistinguishable electron assignments and their interference</text>
<rect x="40" y="56" width="410" height="162" rx="12" fill="white" stroke="#d5dfeb"/><text x="245" y="86" text-anchor="middle" font-size="17" font-weight="700" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#213247">A: a(1) b(2)</text>
<circle cx="150" cy="146" r="43" fill="#397bb1" fill-opacity=".17" stroke="#397bb1" stroke-width="2"/><text x="150" y="143" text-anchor="middle" font-size="13" font-weight="600" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#213247">orbital a</text>
<text x="150" y="162" text-anchor="middle" font-size="11" font-weight="400" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#667789">electron 1</text>
<circle cx="340" cy="146" r="43" fill="#d98d40" fill-opacity=".17" stroke="#d98d40" stroke-width="2"/><text x="340" y="143" text-anchor="middle" font-size="13" font-weight="600" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#213247">orbital b</text>
<text x="340" y="162" text-anchor="middle" font-size="11" font-weight="400" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#667789">electron 2</text>
<rect x="500" y="56" width="410" height="162" rx="12" fill="white" stroke="#d5dfeb"/><text x="705" y="86" text-anchor="middle" font-size="17" font-weight="700" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#213247">B: b(1) a(2)</text>
<circle cx="610" cy="146" r="43" fill="#397bb1" fill-opacity=".17" stroke="#397bb1" stroke-width="2"/><text x="610" y="143" text-anchor="middle" font-size="13" font-weight="600" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#213247">orbital a</text>
<text x="610" y="162" text-anchor="middle" font-size="11" font-weight="400" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#667789">electron 2</text>
<circle cx="800" cy="146" r="43" fill="#d98d40" fill-opacity=".17" stroke="#d98d40" stroke-width="2"/><text x="800" y="143" text-anchor="middle" font-size="13" font-weight="600" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#213247">orbital b</text>
<text x="800" y="162" text-anchor="middle" font-size="11" font-weight="400" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#667789">electron 1</text>
<text x="475" y="247" text-anchor="middle" font-size="19" font-weight="700" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#213247">Antisymmetric fermion state: Ψ = (A − B)/√2</text>
<text x="475" y="273" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#667789">Expanding ⟨Ψ|O|Ψ⟩ gives two direct terms and two exchange cross terms.</text>
</svg>